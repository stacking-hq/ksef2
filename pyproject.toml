[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef2"
version = "1.0.0"
description = "Python SDK and Tools for Poland's KSeF (Krajowy System e-Faktur) API"
readme = "README.md"
authors = [{ name = "Artur Podsiadły" }]
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
pythonpath = "src"
dependencies = [
    "pydantic>=2.12.5",
    "cryptography>=44.0.0",
    "signxml>=4.0",
    "httpx[http2]>=0.28.1",
    "structlog>=25.5.0",
    "xsdata-pydantic>=24.5",
    "tenacity>=9.0",
    "camel-converter>=5.1.0",
    "xsdata>=26.1",
]

[project.urls]
Documentation = "https://docs.stacking.me/ksef2/sdk/getting-started/overview/"
Repository = "https://github.com/stacking-hq/ksef2"
Issues = "https://github.com/stacking-hq/ksef2/issues"
Changelog = "https://github.com/stacking-hq/ksef2/blob/main/CHANGELOG.md"

[project.optional-dependencies]
runtime-checks = [
    "beartype>=0.22.9",
]
pdf = [
    "weasyprint>=63.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37.4",
    "ruff>=0.15.0",
    "pytest>=8.0",
    "respx>=0.22.0",
    "lxml-stubs>=0.5.1",
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "pytest-asyncio>=1.3.0",
    "polyfactory>=3.3.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.1",
]
codegen = [
    "datamodel-code-generator[ruff]>=0.53.0",
    "libcst>=1.8.6",
    "xsdata-pydantic[cli,lxml,soap]>=24.5",
    "xsdata[cli,lxml]>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
markers = [
    "integration: tests that hit the real KSeF TEST environment",
]

[tool.basedpyright]
baselineFile = ".basedpyright/baseline.json"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version",
    "src/ksef2/__version__.py"
]


[tool.ruff.lint]
ignore = ["E731", "E402"]
