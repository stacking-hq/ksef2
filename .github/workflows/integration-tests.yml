name: Integration Tests

on:
  schedule:
    - cron: "0 4 * * *"  # Daily at 4 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**
    paths:
      - "src/ksef2/**"
      - "tests/integration/**"

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install WeasyPrint system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: uv sync --all-groups --extra pdf

      - name: Run integration tests
        env:
          KSEF_TEST_SUBJECT_NIP: ${{ secrets.KSEF_TEST_SUBJECT_NIP }}
          KSEF_TEST_PERSON_NIP: ${{ secrets.KSEF_TEST_PERSON_NIP }}
          KSEF_TEST_PERSON_PESEL: ${{ secrets.KSEF_TEST_PERSON_PESEL }}
        run: uv run pytest tests/integration/ --ignore=tests/integration/test_cli_export_invoices.py -v -m integration

      - name: Report success
        if: success()
        run: |
          echo "### KSeF integration sign-off" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: TEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo "Integration tests failed for $GITHUB_SHA"
