name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      expected_tag:
        description: "Release tag to verify without publishing, for example v1.0.0."
        required: true
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: ksef2-release-${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
  cancel-in-progress: false

env:
  EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
  RELEASE_ARTIFACT_NAME: ksef2-release-${{ github.sha }}

jobs:
  integration:
    name: KSeF TEST integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify downstream docs dispatch configuration
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_DISPATCH_TOKEN" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not configured; tagged docs cannot be deployed."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v4

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install WeasyPrint system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: uv sync --all-groups --extra pdf

      - name: Run integration tests for the release candidate
        env:
          KSEF_TEST_SUBJECT_NIP: ${{ secrets.KSEF_TEST_SUBJECT_NIP }}
          KSEF_TEST_PERSON_NIP: ${{ secrets.KSEF_TEST_PERSON_NIP }}
          KSEF_TEST_PERSON_PESEL: ${{ secrets.KSEF_TEST_PERSON_PESEL }}
        run: uv run pytest tests/integration/ -v -m integration

      - name: Record integration sign-off
        run: |
          echo "### KSeF integration sign-off" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected tag: $EXPECTED_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: TEST" >> "$GITHUB_STEP_SUMMARY"

  build-verify:
    name: Build and verify release artifacts
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: extractions/setup-just@v2

      - name: Install Python runtimes
        run: uv python install 3.12 3.13

      - name: Install dependencies
        run: just sync

      - name: Run release checks and build distributions
        run: just release-check

      - name: Verify release tag and artifact metadata
        run: uv run python scripts/verify_release.py --tag "$EXPECTED_TAG"

      - name: Smoke-test the built wheel on Python 3.12 and 3.13
        run: |
          wheel="dist/ksef2-${EXPECTED_TAG#v}-py3-none-any.whl"
          for python_version in 3.12 3.13; do
            venv_path=".release-venv-${python_version}"
            uv venv --python "$python_version" "$venv_path"
            uv pip install --python "$venv_path/bin/python" "$wheel"
            "$venv_path/bin/python" -c "from ksef2 import AsyncClient, Client; from ksef2.clients import Client as FacadeClient; from ksef2.models import AuthenticationResumeState; assert FacadeClient is Client"
          done

      - name: Assemble the immutable release artifact
        run: |
          mkdir -p release-artifact/dist
          cp dist/ksef2-*.whl dist/ksef2-*.tar.gz release-artifact/dist/
          cd release-artifact
          sha256sum dist/* > SHA256SUMS
          cd ..
          uv run python scripts/extract_release_notes.py --tag "$EXPECTED_TAG" --output release-artifact/release-notes.md

      - name: Upload verified release artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Record artifact verification
        run: |
          echo "### Verified release artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected tag: $EXPECTED_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $RELEASE_ARTIFACT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact digest: ${{ steps.upload.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
          cat release-artifact/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified artifacts to PyPI
    needs: build-verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ksef2
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release-artifact

      - name: Verify downloaded checksums
        working-directory: release-artifact
        run: sha256sum --check SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifact/dist/

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: release-artifact

      - name: Create release from the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifact/dist/* \
            release-artifact/SHA256SUMS \
            --verify-tag \
            --title "ksef2 ${GITHUB_REF_NAME#v}" \
            --notes-file release-artifact/release-notes.md

  notify-docs:
    name: Dispatch tagged docs deployment
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs deployment
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_DISPATCH_TOKEN" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not configured; tagged docs cannot be deployed."
            exit 1
          fi

          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/stacking-hq/ksef2-docs/dispatches \
            -d "$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "event_type": "docs-updated",
              "client_payload": {
                  "product": "sdk",
                  "ref": os.environ["GITHUB_REF_NAME"],
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["GITHUB_SHA"],
              },
          }))
          PY
          )"
