name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Recovery only: start publishing for an existing immutable tag when the
  # tag push started no run. The release-ref job still rejects non-tag refs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-latest
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      # Fail before the integration and upload jobs exist rather than after an
      # irreversible PyPI upload, when notify-docs would be the only thing left.
      - name: Require the docs dispatch token
        shell: bash
        run: |
          [[ -n "$DOCS_DISPATCH_TOKEN" ]] || { echo "::error::DOCS_DISPATCH_TOKEN is not configured; refusing to release before upload"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::Publication requires a tag"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "::error::Checkout SHA mismatch"; exit 1; }
          [[ "$(git rev-parse "$GITHUB_REF^{commit}")" == "$GITHUB_SHA" ]] || { echo "::error::Tag moved from release SHA"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

  integration:
    needs: release-ref
    # Shared with .github/workflows/integration.yml so live KSeF TEST runs never overlap.
    concurrency:
      group: ksef-test-live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v4

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install WeasyPrint system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: uv sync --all-groups --extra pdf

      - name: Run integration tests against KSeF TEST
        env:
          KSEF_TEST_SUBJECT_NIP: ${{ secrets.KSEF_TEST_SUBJECT_NIP }}
          KSEF_TEST_PERSON_NIP: ${{ secrets.KSEF_TEST_PERSON_NIP }}
          KSEF_TEST_PERSON_PESEL: ${{ secrets.KSEF_TEST_PERSON_PESEL }}
        run: |
          mkdir -p output
          uv run --extra pdf python -m pytest tests/integration/ -v -rs -m integration \
            --junitxml=output/release-integration.xml

      # Same command and same gate as .github/workflows/integration.yml, which is what
      # runs them on ordinary commits. Keep the two in step.
      - name: Verify the required KSeF workflows ran
        run: uv run python scripts/verify_integration_results.py output/release-integration.xml

      - name: Record integration sign-off
        run: |
          echo "### KSeF integration sign-off" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: TEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: integration
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v4

      - uses: extractions/setup-just@v2

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: just sync

      - name: Release check
        run: just release-check

      - name: Verify release tag and artifact metadata
        run: uv run python scripts/verify_release.py --tag "$GITHUB_REF_NAME"

      - name: Install and smoke-test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="dist/ksef2-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          for v in 3.12 3.13 3.14; do
            venv_path=".release-venv-$v"
            uv python install "$v"
            uv venv --python "$v" "$venv_path"
            uv pip install --python "$venv_path/bin/python" "$wheel"
            "$venv_path/bin/python" -c "from ksef2 import AsyncClient, Client; from ksef2.clients import Client as FacadeClient; from ksef2.models import AuthenticationResumeState; assert FacadeClient is Client"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify-docs:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs deployment
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_DISPATCH_TOKEN" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not configured; the docs deployment was not dispatched."
            exit 1
          fi

          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/stacking-hq/ksef2-docs/dispatches \
            -d "$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "event_type": "docs-updated",
              "client_payload": {
                  "product": "sdk",
                  "ref": os.environ["GITHUB_REF_NAME"],
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "sha": os.environ["GITHUB_SHA"],
              },
          }))
          PY
          )"
